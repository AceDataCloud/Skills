name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "bin/**"
      - "index.js"
      - "package.json"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/npm-publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: skills-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Verify trusted publishing runtime
        run: |
          node --version
          npm --version
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

      - name: Generate date-based version
        id: version
        run: |
          # npm 要求 semver（3 段），所以用 YYYY.MDD.BUILD 格式
          # 例如 2026.407.0 表示 2026年4月7日第0次构建
          YEAR=$(date +'%Y')
          MMDD=$(date +'%-m%d')
          DATE_PREFIX="${YEAR}.${MMDD}"

          # Registry metadata can lag a staged publish. Use workflow identity so
          # successive merges and retries never select the same staged version.
          test "$GITHUB_RUN_ATTEMPT" -lt 1000
          BUILD=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          VERSION="${DATE_PREFIX}.${BUILD}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Set version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.publish.outputs.version }}" \
            --title "v${{ needs.publish.outputs.version }}" \
            --generate-notes \
            --repo '${{ github.repository }}' || echo "Release already exists, skipping"
