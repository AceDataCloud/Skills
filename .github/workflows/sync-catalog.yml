name: Sync Skill Catalog

# After a merge to main, immediately trigger the AuthBackend
# `skill-catalog-sync` CronJob so the freshly merged skills appear at
# https://auth.acedata.cloud/user/skills without waiting up to 6h for
# the next scheduled run.
#
# Clone the scheduled Job template, but sync only this repository's
# namespace. The scheduled CronJob still refreshes the full catalog.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude-plugin/marketplace.json"
  workflow_dispatch:

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set Kubectl
        uses: Azure/k8s-set-context@v5
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Trigger skill-catalog-sync Job
        run: |
          set -euo pipefail
          JOB_NAME="skill-catalog-sync-skills-${GITHUB_RUN_ID}"
          echo "Creating Job $JOB_NAME from cronjob/auth-backend-skill-catalog-sync"
          kubectl -n acedatacloud create job \
            "$JOB_NAME" \
            --from=cronjob/auth-backend-skill-catalog-sync \
            --dry-run=client -o json | \
            jq '
              .spec.template.spec.containers[0].command[2] |=
                if contains("python manage.py sync_skills\n") then
                  sub("python manage\\.py sync_skills\n";
                      "python -u manage.py sync_skills --namespace acedatacloud\n")
                else error("Unexpected skill catalog sync command") end
            ' | kubectl -n acedatacloud create -f -

          echo "Waiting for Job to complete (up to 20 minutes)…"
          kubectl -n acedatacloud wait \
            --for=condition=complete \
            --timeout=20m \
            "job/$JOB_NAME" || {
              echo "::warning::Job did not complete within 20 minutes; logs follow"
              kubectl -n acedatacloud logs "job/$JOB_NAME" --tail=200 || true
              exit 1
            }

          echo "✓ Job completed. Last log lines:"
          kubectl -n acedatacloud logs "job/$JOB_NAME" --tail=50 || true
